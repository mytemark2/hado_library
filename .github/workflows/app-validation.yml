name: App Validation

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  app-validation:
    name: app-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Run local app validation self-check
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_app_validation.py
