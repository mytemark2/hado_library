name: App Validation

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  app-validation:
    name: app-validation
    runs-on: ubuntu-latest
    steps:
      - name: Validation handled by local Python self-check
        shell: bash
        run: |
          echo "Source validation is performed locally with: python3 tools/run_app_validation.py"

      - name: Preflight Preview repository token for crawler data PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'automation/hado-data-') }}
        shell: bash
        env:
          PREVIEW_REPO_TOKEN: ${{ secrets.PREVIEW_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_REPO_TOKEN}" ]; then
            echo "PREVIEW_REPO_TOKEN is missing; refusing to merge a crawler data PR that cannot reach Preview." >&2
            exit 1
          fi

          api_root="https://api.github.com/repos/mytemark2/hado_library-preview"
          auth_header="Authorization: Bearer ${PREVIEW_REPO_TOKEN}"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"
          check_readiness() {
            local label="$1"
            local url="$2"
            local response_file http_code
            response_file="$(mktemp)"
            http_code="$(curl -sS -o "${response_file}" -w "%{http_code}" \
              -H "${auth_header}" -H "${accept_header}" -H "${version_header}" "${url}" || true)"
            if [ "${http_code}" != "200" ]; then
              echo "Preview credential preflight failed during ${label}; expected HTTP 200, got ${http_code}." >&2
              cat "${response_file}" >&2 || true
              rm -f "${response_file}"
              exit 1
            fi
            rm -f "${response_file}"
          }

          check_readiness "repository access" "${api_root}"
          check_readiness "Pages workflow visibility" "${api_root}/actions/workflows/deploy-preview.yml"
          echo "Preview credential preflight passed before crawler data PR merge."
