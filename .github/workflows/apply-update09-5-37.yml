name: Apply Update09.5.37 tactic evidence slot gate

on:
  push:
    branches:
      - feature/app-3.0.0.0
    paths:
      - .github/workflows/apply-update09-5-37.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/app-3.0.0.0
          fetch-depth: 0
      - name: Apply source patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re
          from datetime import datetime, timezone, timedelta

          formation = Path('hado_formation.js')
          text = formation.read_text(encoding='utf-8')

          old_display = "function formationScoreSourceDisplayLabel(sourceLabel,sourceType=''){const raw=String(sourceLabel||'').trim();if(!raw||raw==='スコア根拠')return raw||'スコア根拠';const parts=raw.split(':').map(v=>v.trim()).filter(Boolean);const owner=parts[0]||raw;const kind=parts.find(v=>/戦法|技能|装備|陣形|五行|軍馬|異文化/.test(v))||({'skill':'技能','tactic':'戦法','equipment':'装備','formation':'陣形','fiveElement':'五行','warhorseSkill':'軍馬技能','ethnicResearchSkill':'異文化調査技能'}[sourceType]||'');return kind?`${owner} / ${kind}`:owner;}"
          new_display = "const FORMATION_SCORE_SOURCE_TYPE_LABELS={skill:'技能',tactic:'戦法',statusEffect:'状態変化',equipment:'装備',formation:'陣形',fiveElement:'五行',warhorseSkill:'軍馬技能',ethnicResearchSkill:'異文化調査技能'};\nfunction formationScoreSourceDisplayLabel(sourceLabel,sourceType=''){const raw=String(sourceLabel||'').trim();if(!raw||raw==='スコア根拠')return raw||'スコア根拠';const parts=raw.split(/[:：]/).map(v=>v.trim()).filter(Boolean);const owner=parts[0]||raw;const kind=FORMATION_SCORE_SOURCE_TYPE_LABELS[sourceType]||parts.find(v=>['戦法','技能','装備','陣形','五行','軍馬技能','異文化調査技能','状態変化'].includes(v))||'';return kind?`${owner} / ${kind}`:owner;}"
          if old_display not in text and new_display not in text:
              raise SystemExit('formationScoreSourceDisplayLabel target not found')
          text = text.replace(old_display, new_display)

          old_create = "function createFormationScoreEvidence(row,index,sourceKind){const rawText=String(row?.rawText||row?.matchedText||[row?.key,row?.label,row?.group,row?.timing,row?.condition,row?.sourceLabel,row?.value].filter(Boolean).join(' '));const label=String(row?.label||row?.key||row?.statusEffectName||'');const family=inferFormationScoreEvidenceFamily({...row,rawText,label});if(!family)return null;const sourceLabel=String(row?.sourceLabel||row?.sourceItemName||row?.source||sourceKind||'');const timing=normalizeFormationScoreEvidenceTiming(row?.timing||row?.timingLabel||'');const targetScope=inferFormationScoreEvidenceTargetScope({...row,rawText,label});const sourceType=sourceKind==='parameter'?'formation':(row?.sourceType||row?.sourceItemCategory||'skill');const sourceId=String(row?.sourceId||row?.featureId||sourceLabel||`${sourceKind}:${index}`);const sourceName=String(row?.sourceName||sourceLabel.split(':')[0]||sourceLabel||'');const rootStatusEffectName=formationRootEffectName(row,family,label);const rootSkillName=String(row?.rootSkillName||(/技能/.test(sourceLabel)?(sourceLabel.split(':').pop()||''):'')).replace(/[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+$/,'');const rootTacticName=String(row?.rootTacticName||(/戦法/.test(sourceLabel)?(sourceLabel.split(':').pop()||''):'')).replace(/[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+$/,'');const rootEvidenceKey=row?.rootEvidenceKey||formationScoreRootEvidenceKey({sourceName,sourceSlot:row?.sourceSlot||'',sourceType,changeItemId:family,rootStatusEffectName,rootSkillName,rootTacticName,normalizedEffectName:rootStatusEffectName||label,targetScope,timing});const key=row?.evidenceGroupKey||rootEvidenceKey;return {evidenceId:`formation:${sourceKind}:${index}:${family}:${norm(sourceId)}`,sourceType,sourceId,sourceLabel,sourceName:String(row?.sourceName||sourceName),sourceSlot:row?.sourceSlot||'',sourceOrigin:row?.sourceOrigin||'',timing,targetScope,effectFamily:family,rawText,matchedText:rawText,isPrimaryEffect:row?.isPrimaryEffect!==false,isDerivedTag:!!row?.isDerivedTag,isAggregateMetric:!!row?.isAggregateMetric,primaryResolved:row?.primaryResolved!==false,evidenceGroupKey:key,rootEvidenceKey,rootStatusEffectName,rootSkillName,rootTacticName,sourceKind:sourceKind==='parameter'?'parameter':'effect',label:label||family,key:row?.key||label,value:row?.value||'',condition:row?.condition||'',mergedSources:row?.mergedSources||[],mergedEvidenceCount:Number(row?.mergedEvidenceCount||1),duplicateSuppressedCount:Number(row?.duplicateSuppressedCount||0)};}"
          new_create = "const FORMATION_SCORE_ACTIVE_TACTIC_SOURCE_SLOTS=new Set(['main','deputy1','deputy2']);\nfunction createFormationScoreEvidence(row,index,sourceKind){const rawText=String(row?.rawText||row?.matchedText||[row?.key,row?.label,row?.group,row?.timing,row?.condition,row?.sourceLabel,row?.value].filter(Boolean).join(' '));const label=String(row?.label||row?.key||row?.statusEffectName||'');const family=inferFormationScoreEvidenceFamily({...row,rawText,label});if(!family)return null;const sourceLabel=String(row?.sourceLabel||row?.sourceItemName||row?.source||sourceKind||'');const timing=normalizeFormationScoreEvidenceTiming(row?.timing||row?.timingLabel||'');const targetScope=inferFormationScoreEvidenceTargetScope({...row,rawText,label});const sourceType=sourceKind==='parameter'?'formation':(row?.sourceType||row?.sourceItemCategory||'skill');const sourceSlot=String(row?.sourceSlot||row?.sourceSlotKey||row?.slotKey||row?.holderSlot||'');if(sourceType==='tactic'&&!FORMATION_SCORE_ACTIVE_TACTIC_SOURCE_SLOTS.has(sourceSlot))return null;const sourceId=String(row?.sourceId||row?.featureId||sourceLabel||`${sourceKind}:${index}`);const sourceName=String(row?.sourceName||sourceLabel.split(':')[0]||sourceLabel||'');const rootStatusEffectName=formationRootEffectName(row,family,label);const rootSkillName=String(row?.rootSkillName||(/技能/.test(sourceLabel)?(sourceLabel.split(':').pop()||''):'')).replace(/[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+$/,'');const rootTacticName=String(row?.rootTacticName||(/戦法/.test(sourceLabel)?(sourceLabel.split(':').pop()||''):'')).replace(/[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+$/,'');const rootEvidenceKey=row?.rootEvidenceKey||formationScoreRootEvidenceKey({sourceName,sourceSlot,sourceType,changeItemId:family,rootStatusEffectName,rootSkillName,rootTacticName,normalizedEffectName:rootStatusEffectName||label,targetScope,timing});const key=row?.evidenceGroupKey||rootEvidenceKey;return {evidenceId:`formation:${sourceKind}:${index}:${family}:${norm(sourceId)}`,sourceType,sourceId,sourceLabel,sourceName:String(row?.sourceName||sourceName),sourceSlot,sourceOrigin:row?.sourceOrigin||'',timing,targetScope,effectFamily:family,rawText,matchedText:rawText,isPrimaryEffect:row?.isPrimaryEffect!==false,isDerivedTag:!!row?.isDerivedTag,isAggregateMetric:!!row?.isAggregateMetric,primaryResolved:row?.primaryResolved!==false,evidenceGroupKey:key,rootEvidenceKey,rootStatusEffectName,rootSkillName,rootTacticName,sourceKind:sourceKind==='parameter'?'parameter':'effect',label:label||family,key:row?.key||label,value:row?.value||'',condition:row?.condition||'',mergedSources:row?.mergedSources||[],mergedEvidenceCount:Number(row?.mergedEvidenceCount||1),duplicateSuppressedCount:Number(row?.duplicateSuppressedCount||0)};}"
          if old_create not in text and new_create not in text:
              raise SystemExit('createFormationScoreEvidence target not found')
          text = text.replace(old_create, new_create)

          old_candidate = "const sourceLabel=ref?.sourceLabel||ref?.sourceName||`${row.holder||entry?.name||''}:${row.kind||'配置候補'}:${label}`;const sourceType=normalizeFormationCandidateEvidenceSourceType(ref,row,category);const derivedNeedsPrimary=formationCandidateDerivedNeedsPrimary(ref,wrap.origin,sourceText);"
          new_candidate = "const sourceLabel=ref?.sourceLabel||ref?.sourceName||`${row.holder||entry?.name||''}:${row.kind||'配置候補'}:${label}`;const sourceType=normalizeFormationCandidateEvidenceSourceType(ref,row,category);if(sourceType==='tactic'&&!FORMATION_SCORE_ACTIVE_TACTIC_SOURCE_SLOTS.has(String(row.slotKey||''))){const mismatchReason='tactic_source_inactive_slot';mismatches.push({...diag,candidateLabel:label,mismatchReason,sourceType,sourceSlot:row.slotKey||'',reason:'戦法由来効果は主将・副将1・副将2のみ有効'});diagnosticRows.push({...diag,sourceType,sourceSlot:row.slotKey||'',primaryResolved:false,excludedReason:mismatchReason});return;}const derivedNeedsPrimary=formationCandidateDerivedNeedsPrimary(ref,wrap.origin,sourceText);"
          if old_candidate not in text and new_candidate not in text:
              raise SystemExit('candidate tactic gate target not found')
          text = text.replace(old_candidate, new_candidate)

          old_reasons = "aggregate_or_derived_origin:'集計・派生根拠のため直接評価対象外'};"
          new_reasons = "aggregate_or_derived_origin:'集計・派生根拠のため直接評価対象外',tactic_source_inactive_slot:'戦法由来効果は主将・副将1・副将2のみ有効'};"
          if old_reasons not in text and new_reasons not in text:
              raise SystemExit('exclude reason label target not found')
          text = text.replace(old_reasons, new_reasons)
          formation.write_text(text, encoding='utf-8')

          version = Path('hado_version.js')
          v = version.read_text(encoding='utf-8')
          v = v.replace("updateNo: '09.5.36'", "updateNo: '09.5.37'")
          v = v.replace('revision: 126', 'revision: 127')
          v = v.replace("summary: 'Update09.5.36: restore derived metadata for type-search presets.'", "summary: 'Update09.5.37: gate tactic evidence to active tactic slots and normalize source labels.'")
          v = re.sub(r"updatedAt: '[^']+'", "updatedAt: '2026-07-05T22:05:00+09:00'", v)
          version.write_text(v, encoding='utf-8')

          dev = Path('HADO_DEV_INFO.json')
          obj = json.loads(dev.read_text(encoding='utf-8'))
          obj['updatedAt'] = '2026-07-05T22:05:00+09:00'
          dev.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('.github/workflows/apply-update09-5-37.yml').unlink(missing_ok=True)
          PY
      - name: Validate patched files
        run: |
          node --check hado_formation.js
          node --check hado_type_score.js
          node --check hado_version.js
          python3 -m json.tool HADO_DEV_INFO.json >/dev/null
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hado_formation.js hado_version.js HADO_DEV_INFO.json .github/workflows/apply-update09-5-37.yml
          git commit -m 'Update09.5.37 gate tactic evidence slots'
          git push origin HEAD:feature/app-3.0.0.0
