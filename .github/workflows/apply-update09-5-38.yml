name: Apply Update09.5.38 tactic inference
on:
  push:
    branches: [feature/app-3.0.0.0]
    paths: [.github/workflows/apply-update09-5-38.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/app-3.0.0.0
      - name: Patch source
        run: |
          node <<'NODE'
          const fs = require('fs');
          let s = fs.readFileSync('hado_formation.js','utf8');
          function rep(a,b){ if(!s.includes(b)){ if(!s.includes(a)) throw new Error('missing target'); s=s.replace(a,b); } }
          rep("const FORMATION_SCORE_ACTIVE_TACTIC_SOURCE_SLOTS=new Set(['main','deputy1','deputy2']);",
              "const FORMATION_SCORE_ACTIVE_TACTIC_SOURCE_SLOTS=new Set(['main','deputy1','deputy2']);\nfunction formationScoreTacticSourceSlotActive(row={},sourceLabel=''){const slot=String(row?.sourceSlot||row?.slotKey||'');const roleText=[row?.kind,row?.rowKind,row?.slotLabel,sourceLabel].filter(Boolean).join(':');if(/侍従|補佐/.test(roleText))return false;return FORMATION_SCORE_ACTIVE_TACTIC_SOURCE_SLOTS.has(slot);}");
          rep("if(sourceType==='tactic'&&!FORMATION_SCORE_ACTIVE_TACTIC_SOURCE_SLOTS.has(sourceSlot))return null;",
              "if(sourceType==='tactic'&&!formationScoreTacticSourceSlotActive({sourceSlot,kind:row?.kind,rowKind:row?.rowKind,slotLabel:row?.slotLabel},sourceLabel))return null;");
          if(!s.includes('function formationCandidateSourceLooksLikeTactic')){
            const re = /function normalizeFormationCandidateEvidenceSourceType\(ref,row,category\)\{.*?return category==='equipments'\?'equipment':'skill';\}/s;
            const repl = "function formationCandidateSourceLooksLikeTactic(ref,sourceText=''){const text=[ref?.featureId,ref?.sourceType,ref?.sourcePartType,ref?.sourceKind,ref?.sourceLabel,ref?.sourceName,ref?.label,ref?.statusEffectName,sourceText].filter(Boolean).join(' ');const n=norm(text);if(String(ref?.sourceType||'').trim()==='tactic')return true;if(/tactic_effect|戦法全文/.test(n))return true;if(String(sourceText||'').includes('発動間隔')&&String(sourceText||'').includes('連鎖順'))return true;if(/の戦法/.test(String(sourceText||'')))return true;return false;}\nfunction normalizeFormationCandidateEvidenceSourceType(ref,row,category){const sourceText=formationCandidateSourceText(ref);const text=[ref?.sourceType,ref?.sourcePartType,ref?.sourceKind,ref?.sourceLabel,ref?.sourceName,row?.kind,category].filter(Boolean).join(' ');const n=norm(text);const explicit=String(ref?.sourceType||'').trim();if(formationCandidateSourceLooksLikeTactic(ref,sourceText))return 'tactic';if(['skill','statusEffect','equipment','formation','fiveElement','warhorseSkill','ethnicResearchSkill'].includes(explicit))return explicit;if(/tactic/.test(n))return 'tactic';if(/装備|武器|防具|文物|equipment/.test(n))return 'equipment';if(/陣形|formation/.test(n))return 'formation';if(/五行|火行|水行|木行|金行|土行|fiveelement/.test(n))return 'fiveElement';if(/軍馬技能|名馬技能|warhorseskill/.test(n))return 'warhorseSkill';if(/異文化|ethnic/.test(n))return 'ethnicResearchSkill';if(/技能|武将|general|skill/.test(n))return 'skill';return category==='equipments'?'equipment':'skill';}";
            if(!re.test(s)) throw new Error('missing normalize source type');
            s = s.replace(re, repl);
          }
          rep("if(sourceType==='tactic'&&!FORMATION_SCORE_ACTIVE_TACTIC_SOURCE_SLOTS.has(String(row.slotKey||''))){",
              "if(sourceType==='tactic'&&!formationScoreTacticSourceSlotActive(row,sourceLabel)){");
          fs.writeFileSync('hado_formation.js',s);
          let v=fs.readFileSync('hado_version.js','utf8');
          v=v.replace("updateNo: '09.5.37'","updateNo: '09.5.38'").replace('revision: 127','revision: 128').replace("summary: 'Update09.5.37: gate tactic evidence to active tactic slots and normalize source labels.'","summary: 'Update09.5.38: infer tactic evidence from tactic source text before slot gating.'").replace(/updatedAt: '[^']+'/,"updatedAt: '2026-07-05T22:45:00+09:00'");
          fs.writeFileSync('hado_version.js',v);
          const info=JSON.parse(fs.readFileSync('HADO_DEV_INFO.json','utf8'));
          info.updatedAt='2026-07-05T22:45:00+09:00';
          fs.writeFileSync('HADO_DEV_INFO.json',JSON.stringify(info,null,2)+'\n');
          NODE
          rm -f .github/workflows/apply-update09-5-38.yml
      - name: Validate and commit
        run: |
          node --check hado_formation.js
          node --check hado_type_score.js
          node --check hado_version.js
          python3 -m json.tool HADO_DEV_INFO.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hado_formation.js hado_version.js HADO_DEV_INFO.json .github/workflows/apply-update09-5-38.yml
          git commit -m 'Update09.5.38 infer tactic evidence before slot gating'
          git push origin HEAD:feature/app-3.0.0.0
