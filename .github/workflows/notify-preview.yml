name: Notify Hado Library Preview

on:
  push:

permissions:
  contents: read

env:
  ALLOWED_PREVIEW_SOURCE_BRANCH: feature/app-3.0.0.0

concurrency:
  group: hado-library-preview-sync
  cancel-in-progress: true

jobs:
  notify-preview:
    if: ${{ github.event.deleted == false && github.ref == 'refs/heads/feature/app-3.0.0.0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Resolve app branch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          APP_REF="${GITHUB_REF_NAME}"
          if [ -z "${APP_REF}" ]; then
            echo "Source branch name could not be resolved." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF:-}" == refs/heads/codex/* ]]; then
            echo "Refusing preview sync from Codex work branch ${GITHUB_REF}; only ${ALLOWED_PREVIEW_SOURCE_BRANCH} may update mytemark2/hado_library-preview." >&2
            exit 1
          fi
          if [ "${APP_REF}" != "${ALLOWED_PREVIEW_SOURCE_BRANCH}" ]; then
            echo "Refusing preview sync from ${APP_REF}; only ${ALLOWED_PREVIEW_SOURCE_BRANCH} may update mytemark2/hado_library-preview." >&2
            exit 1
          fi
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          if [ "${SOURCE_COMMIT}" != "${GITHUB_SHA}" ]; then
            echo "Checked-out source commit ${SOURCE_COMMIT} does not match GITHUB_SHA ${GITHUB_SHA}." >&2
            exit 1
          fi
          echo "app_ref=${APP_REF}" >> "${GITHUB_OUTPUT}"
          echo "source_commit=${SOURCE_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "Preview source branch: ${APP_REF}"
          echo "Preview source commit: ${SOURCE_COMMIT}"

      - name: Read source display version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          display_version="$(python - <<'PY'
          import re
          from pathlib import Path
          source = Path('hado_version.js').read_text(encoding='utf-8')
          release = re.search(r"releaseVersion:\s*'([^']+)'", source)
          update = re.search(r"updateNo:\s*'([^']+)'", source)
          if not release or not update:
              raise SystemExit('releaseVersion/updateNo not found in hado_version.js')
          print(f"{release.group(1)} Update{update.group(1)}")
          PY
          )"
          if [ -z "${display_version}" ]; then
            echo "displayVersion could not be resolved from hado_version.js" >&2
            exit 1
          fi
          echo "display_version=${display_version}" >> "${GITHUB_OUTPUT}"
          echo "Source display version: ${display_version}"

      - name: Require preview repository token
        shell: bash
        env:
          PREVIEW_REPO_TOKEN: ${{ secrets.PREVIEW_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_REPO_TOKEN}" ]; then
            echo "Repository secret PREVIEW_REPO_TOKEN is missing." >&2
            echo "Create a fine-grained token with access to mytemark2/hado_library-preview and permissions Contents: Read and write, plus enough Actions read access to view preview workflow runs, then register it as PREVIEW_REPO_TOKEN in mytemark2/hado_library. The app sync does not rerun preview workflow jobs automatically." >&2
            exit 1
          fi

      - name: Preflight preview token permissions
        shell: bash
        env:
          PREVIEW_REPO_TOKEN: ${{ secrets.PREVIEW_REPO_TOKEN }}
        run: |
          set -euo pipefail
          api_root="https://api.github.com/repos/mytemark2/hado_library-preview"
          workflow_file="jekyll-gh-pages.yml"
          auth_header="Authorization: Bearer ${PREVIEW_REPO_TOKEN}"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          require_status() {
            local expected="$1"
            local label="$2"
            shift 2
            local response_file headers_file http_code
            response_file="$(mktemp)"
            headers_file="$(mktemp)"
            http_code="$(curl -sS -o "${response_file}" -D "${headers_file}" -w "%{http_code}" "$@" || true)"
            if [ "${http_code}" != "${expected}" ]; then
              echo "PREVIEW_REPO_TOKEN preflight failed during ${label}; expected HTTP ${expected}, got ${http_code}." >&2
              echo "The token must be scoped to mytemark2/hado_library-preview with Contents: Read and write and enough Actions read access to view preview workflow runs before preview files are pushed." >&2
              echo "Response body:" >&2
              cat "${response_file}" >&2 || true
              rm -f "${response_file}" "${headers_file}"
              exit 1
            fi
            local scopes
            scopes="$(awk 'BEGIN{IGNORECASE=1} /^x-oauth-scopes:/ {sub(/^[^:]*:[[:space:]]*/, ""); print}' "${headers_file}" | tr -d '\r' | tail -n 1)"
            if [ -n "${scopes}" ] && [[ ",${scopes// /}," != *",repo,"* ]]; then
              echo "PREVIEW_REPO_TOKEN appears to be a classic PAT without repo scope: ${scopes}" >&2
              echo "Use a fine-grained token with Contents: Read and write, or a classic token with repo scope." >&2
              rm -f "${response_file}" "${headers_file}"
              exit 1
            fi
            rm -f "${response_file}" "${headers_file}"
          }

          require_status 200 "repository access check" \
            -H "${auth_header}" \
            -H "${accept_header}" \
            -H "${version_header}" \
            "${api_root}"

          require_status 200 "Pages workflow visibility check" \
            -H "${auth_header}" \
            -H "${accept_header}" \
            -H "${version_header}" \
            "${api_root}/actions/workflows/${workflow_file}"

          echo "PREVIEW_REPO_TOKEN preflight passed before preview repository push: repository access and Pages workflow visibility are available."

      - name: Sync preview repository contents
        id: sync
        shell: bash
        env:
          PREVIEW_REPO_TOKEN: ${{ secrets.PREVIEW_REPO_TOKEN }}
          APP_REF: ${{ steps.source.outputs.app_ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          DISPLAY_VERSION: ${{ steps.meta.outputs.display_version }}
        run: |
          set -euo pipefail
          changed=false
          preview_commit=""
          for attempt in 1 2 3; do
            PREVIEW_DIR="$(mktemp -d)"
            echo "Preview sync attempt ${attempt}/3"
            git clone --depth 1 "https://x-access-token:${PREVIEW_REPO_TOKEN}@github.com/mytemark2/hado_library-preview.git" "${PREVIEW_DIR}"

            if [ ! -f "${PREVIEW_DIR}/.github/workflows/jekyll-gh-pages.yml" ]; then
              echo "Preview Pages workflow .github/workflows/jekyll-gh-pages.yml was not found in mytemark2/hado_library-preview." >&2
              exit 1
            fi

            find "${PREVIEW_DIR}" -mindepth 1 -maxdepth 1 -not -name '.git' -not -name '.github' -exec rm -rf {} +
            rsync -a index.html HADO_DEV_INFO.json hado_*.js hado_styles.css hadou_*.json "${PREVIEW_DIR}/"

            touch "${PREVIEW_DIR}/.nojekyll"
            printf '%s\n' "${SOURCE_COMMIT}" > "${PREVIEW_DIR}/PREVIEW_SOURCE_COMMIT.txt"
            printf '%s\n' "${APP_REF}" > "${PREVIEW_DIR}/PREVIEW_SOURCE_BRANCH.txt"
            printf '%s\n' "${DISPLAY_VERSION}" > "${PREVIEW_DIR}/PREVIEW_DISPLAY_VERSION.txt"
            sha256sum index.html hado_formation.js hado_styles.css hado_version.js HADO_DEV_INFO.json > "${PREVIEW_DIR}/PREVIEW_SOURCE_FILES.txt"

            test -s "${PREVIEW_DIR}/hado_formation.js"
            test -s "${PREVIEW_DIR}/hado_styles.css"
            test -s "${PREVIEW_DIR}/HADO_DEV_INFO.json"
            cmp -s HADO_DEV_INFO.json "${PREVIEW_DIR}/HADO_DEV_INFO.json"
            test -s "${PREVIEW_DIR}/PREVIEW_SOURCE_COMMIT.txt"
            test -s "${PREVIEW_DIR}/PREVIEW_SOURCE_BRANCH.txt"
            test -s "${PREVIEW_DIR}/PREVIEW_DISPLAY_VERSION.txt"
            test -s "${PREVIEW_DIR}/PREVIEW_SOURCE_FILES.txt"
            test "$(cat "${PREVIEW_DIR}/PREVIEW_SOURCE_BRANCH.txt")" = "${ALLOWED_PREVIEW_SOURCE_BRANCH}"
            test "$(cat "${PREVIEW_DIR}/PREVIEW_SOURCE_COMMIT.txt")" = "${SOURCE_COMMIT}"
            test "$(cat "${PREVIEW_DIR}/PREVIEW_DISPLAY_VERSION.txt")" = "${DISPLAY_VERSION}"
            (cd "${PREVIEW_DIR}" && sha256sum -c PREVIEW_SOURCE_FILES.txt)

            git -C "${PREVIEW_DIR}" config user.name "github-actions[bot]"
            git -C "${PREVIEW_DIR}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # The app preview sync must never edit hado_library-preview/.github files.
            # Preview workflow settings such as cancel-in-progress must be changed separately with workflow-scoped permission.
            (
              cd "${PREVIEW_DIR}"
              shopt -s nullglob
              sync_paths=(
                index.html
                HADO_DEV_INFO.json
                hado_*.js
                hado_styles.css
                hadou_*.json
                .nojekyll
                PREVIEW_SOURCE_COMMIT.txt
                PREVIEW_SOURCE_BRANCH.txt
                PREVIEW_DISPLAY_VERSION.txt
                PREVIEW_SOURCE_FILES.txt
              )
              if [ "${#sync_paths[@]}" -gt 0 ]; then
                git add -- "${sync_paths[@]}"
              fi
              git add -u -- \
                index.html \
                HADO_DEV_INFO.json \
                'hado_*.js' \
                hado_styles.css \
                'hadou_*.json' \
                .nojekyll \
                PREVIEW_SOURCE_COMMIT.txt \
                PREVIEW_SOURCE_BRANCH.txt \
                PREVIEW_DISPLAY_VERSION.txt \
                PREVIEW_SOURCE_FILES.txt
              staged_files="$(git diff --cached --name-only)"
              echo "Preview staged files:"
              printf '%s\n' "${staged_files}"
              while IFS= read -r staged_file; do
                case "${staged_file}" in
                  .github/*)
                    echo "preview sync must never stage .github files: ${staged_file}" >&2
                    exit 1
                    ;;
                esac
              done <<< "${staged_files}"
            )
            if git -C "${PREVIEW_DIR}" diff --cached --quiet; then
              echo "No preview repository changes."
              preview_commit="$(git -C "${PREVIEW_DIR}" rev-parse HEAD)"
              rm -rf "${PREVIEW_DIR}"
              echo "changed=false" >> "${GITHUB_OUTPUT}"
              echo "preview_commit=${preview_commit}" >> "${GITHUB_OUTPUT}"
              break
            fi

            git -C "${PREVIEW_DIR}" commit -m "sync preview from ${APP_REF}: ${SOURCE_COMMIT}"
            preview_commit="$(git -C "${PREVIEW_DIR}" rev-parse HEAD)"
            push_output="$(mktemp)"
            if git -C "${PREVIEW_DIR}" push origin HEAD:main >"${push_output}" 2>&1; then
              changed=true
              rm -f "${push_output}"
              rm -rf "${PREVIEW_DIR}"
              echo "changed=true" >> "${GITHUB_OUTPUT}"
              echo "preview_commit=${preview_commit}" >> "${GITHUB_OUTPUT}"
              break
            fi
            cat "${push_output}" >&2 || true
            if grep -qiE 'without[^[:cntrl:]]*workflow scope|workflow scope|refusing to allow[^[:cntrl:]]*workflow' "${push_output}"; then
              echo "Preview repository push failed: workflow file was staged or preview token lacks workflow scope." >&2
              echo "The app preview sync must not edit mytemark2/hado_library-preview/.github/workflows/jekyll-gh-pages.yml; fix preview workflow settings separately with workflow-scoped permission." >&2
              rm -f "${push_output}"
              rm -rf "${PREVIEW_DIR}"
              exit 1
            fi
            if ! grep -qiE 'fetch first|non-fast-forward|stale info|failed to push some refs' "${push_output}"; then
              echo "Preview repository push failed for a non-retryable reason." >&2
              rm -f "${push_output}"
              rm -rf "${PREVIEW_DIR}"
              exit 1
            fi
            rm -f "${push_output}"

            rm -rf "${PREVIEW_DIR}"
            if [ "${attempt}" = "3" ]; then
              echo "Preview repository push failed after ${attempt} attempts due to repeated non-fast-forward updates." >&2
              exit 1
            fi
            echo "Preview repository main changed during push; retrying with a fresh clone." >&2
            sleep $((attempt * 5))
          done
          if [ -z "${preview_commit}" ]; then
            echo "Preview repository commit could not be resolved." >&2
            exit 1
          fi
          echo "Preview repository content is synchronized from ${APP_REF} (${SOURCE_COMMIT}); changed=${changed}; preview_commit=${preview_commit}."


      - name: Wait for preview Pages deployment
        shell: bash
        env:
          PREVIEW_REPO_TOKEN: ${{ secrets.PREVIEW_REPO_TOKEN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          DISPLAY_VERSION: ${{ steps.meta.outputs.display_version }}
          PREVIEW_COMMIT: ${{ steps.sync.outputs.preview_commit }}
        run: |
          set -euo pipefail
          api_root="https://api.github.com/repos/mytemark2/hado_library-preview"
          workflow_file="jekyll-gh-pages.yml"
          auth_header="Authorization: Bearer ${PREVIEW_REPO_TOKEN}"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"
          if [ -z "${PREVIEW_COMMIT}" ]; then
            echo "Preview repository commit output is missing; cannot wait for Pages deployment." >&2
            exit 1
          fi

          github_api_json() {
            local label="$1"
            local url="$2"
            local response_file http_code attempt
            response_file="$(mktemp)"
            for attempt in $(seq 1 6); do
              http_code="$(curl -sS -o "${response_file}" -w "%{http_code}"                 -H "${auth_header}"                 -H "${accept_header}"                 -H "${version_header}"                 "${url}" || true)"
              if [ "${http_code}" = "200" ]; then
                cat "${response_file}"
                rm -f "${response_file}"
                return 0
              fi
              if [ "${http_code}" = "401" ] || [ "${http_code}" = "403" ] || [[ "${http_code}" == 5* ]]; then
                echo "GitHub API ${label} returned HTTP ${http_code}; retrying (${attempt}/6)." >&2
                sleep $((attempt * 5))
                continue
              fi
              echo "GitHub API ${label} failed with HTTP ${http_code}." >&2
              echo "Response body:" >&2
              cat "${response_file}" >&2 || true
              rm -f "${response_file}"
              exit 1
            done
            echo "GitHub API ${label} did not return HTTP 200 after retries." >&2
            echo "Last response body:" >&2
            cat "${response_file}" >&2 || true
            rm -f "${response_file}"
            exit 1
          }

          echo "Waiting for preview Pages workflow ${workflow_file} on main for preview commit ${PREVIEW_COMMIT}."
          run_id=""
          run_status=""
          run_conclusion=""
          for selection_attempt in $(seq 1 30); do
            runs_json="$(github_api_json "list preview Pages workflow runs" "${api_root}/actions/workflows/${workflow_file}/runs?branch=main&event=push&per_page=20")"
            runs_file="$(mktemp)"
            printf '%s' "${runs_json}" > "${runs_file}"
          run_id="$(RUNS_FILE="${runs_file}" PREVIEW_COMMIT="${PREVIEW_COMMIT}" python - <<'PY'
          import json
          import os
          with open(os.environ['RUNS_FILE'], encoding='utf-8') as fh:
              data = json.load(fh)
          preview_commit = os.environ['PREVIEW_COMMIT']
          candidates = [
              run for run in data.get('workflow_runs', [])
              if str(run.get('head_sha', '')) == preview_commit
              and not (
                  str(run.get('status', '')) == 'completed'
                  and str(run.get('conclusion', '')) in {'cancelled', 'skipped'}
              )
          ]
          candidates.sort(key=lambda run: str(run.get('created_at', '')), reverse=True)
          if candidates:
              print(candidates[0].get('id', ''))
          PY
          )"
            rm -f "${runs_file}"
            if [ -z "${run_id}" ]; then
              echo "No viable preview Pages run for ${PREVIEW_COMMIT} yet; retrying (${selection_attempt}/30)."
              sleep 5
              continue
            fi
            echo "Preview Pages workflow run id: ${run_id}"
            run_status=""
            run_conclusion=""
            for poll_attempt in $(seq 1 120); do
              run_json="$(github_api_json "get preview Pages workflow run ${run_id}" "${api_root}/actions/runs/${run_id}")"
            status="$(RUN_JSON="${run_json}" python - <<'PY'
          import json, os
          print(json.loads(os.environ['RUN_JSON']).get('status', ''))
          PY
          )"
            conclusion="$(RUN_JSON="${run_json}" python - <<'PY'
          import json, os
          print(json.loads(os.environ['RUN_JSON']).get('conclusion') or '')
          PY
          )"
              echo "Preview Pages workflow run ${run_id}: status=${status} conclusion=${conclusion:-pending}"
              if [ "${status}" = "completed" ]; then
                if [ "${conclusion}" = "success" ]; then
                  run_status="${status}"
                  run_conclusion="${conclusion}"
                  break
                fi
                if [ "${conclusion}" = "cancelled" ] || [ "${conclusion}" = "skipped" ]; then
                  echo "Preview Pages workflow run ${run_id} was ${conclusion}; searching for another viable run for the same commit." >&2
                  run_id=""
                  break
                fi
              jobs_json="$(github_api_json "list preview Pages workflow jobs for failed run ${run_id}" "${api_root}/actions/runs/${run_id}/jobs?filter=latest&per_page=100")"
              failed_jobs="$(JOBS_JSON="${jobs_json}" python - <<'PY'
          import json, os
          jobs = json.loads(os.environ['JOBS_JSON']).get('jobs', [])
          failed = [job.get('name', '') for job in jobs if job.get('conclusion') and job.get('conclusion') != 'success']
          print(', '.join(failed) if failed else 'unknown')
          PY
          )"
              echo "Preview Pages workflow run ${run_id} completed with conclusion=${conclusion}." >&2
              echo "Failed preview jobs: ${failed_jobs}" >&2
              echo "Preview synchronization is incomplete until this Pages deployment succeeds." >&2
              exit 1
              fi
              sleep 10
            done
            if [ "${run_status}" = "completed" ] && [ "${run_conclusion}" = "success" ]; then
              break
            fi
            if [ -z "${run_id}" ]; then
              sleep 5
              continue
            fi
            echo "Preview Pages workflow run ${run_id} did not complete successfully in time." >&2
            exit 1
          done
          if [ "${run_status}" != "completed" ] || [ "${run_conclusion}" != "success" ]; then
            echo "Preview Pages workflow did not produce a successful run for preview commit ${PREVIEW_COMMIT}." >&2
            exit 1
          fi

          source_url="https://mytemark2.github.io/hado_library-preview/PREVIEW_SOURCE_COMMIT.txt?cb=${SOURCE_COMMIT}"
          version_url="https://mytemark2.github.io/hado_library-preview/PREVIEW_DISPLAY_VERSION.txt?cb=${SOURCE_COMMIT}"
          for attempt in $(seq 1 60); do
            public_source="$(curl --fail -sS --max-time 15 "${source_url}" | tr -d '\r\n' || true)"
            public_version="$(curl --fail -sS --max-time 15 "${version_url}" | tr -d '\r\n' || true)"
            echo "Public preview markers (${attempt}/60): source=${public_source:-missing} version=${public_version:-missing}"
            if [ "${public_source}" = "${SOURCE_COMMIT}" ] && [ "${public_version}" = "${DISPLAY_VERSION}" ]; then
              echo "Public preview matches source commit ${SOURCE_COMMIT} and display version ${DISPLAY_VERSION}."
              exit 0
            fi
            sleep 10
          done
          echo "Public preview markers did not match expected source commit/version after Pages deployment." >&2
          echo "Expected source=${SOURCE_COMMIT}; expected version=${DISPLAY_VERSION}." >&2
          exit 1
