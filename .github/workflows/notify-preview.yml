name: Notify Hado Library Preview

on:
  push:

permissions:
  contents: read

env:
  ALLOWED_PREVIEW_SOURCE_BRANCH: feature/app-3.0.0.0

concurrency:
  group: hado-library-preview-sync
  cancel-in-progress: true

jobs:
  notify-preview:
    if: ${{ github.event.deleted == false && github.ref == 'refs/heads/feature/app-3.0.0.0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Resolve app branch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          APP_REF="${GITHUB_REF_NAME}"
          if [ -z "${APP_REF}" ]; then
            echo "Source branch name could not be resolved." >&2
            exit 1
          fi
          case "${APP_REF}" in
            codex/*|*/codex/*|codex*|*identify-and-propose-ui*)
              echo "Refusing preview sync from prohibited Codex/PR branch ${APP_REF}; only ${ALLOWED_PREVIEW_SOURCE_BRANCH} may update mytemark2/hado_library-preview." >&2
              exit 1
              ;;
          esac
          if [ "${APP_REF}" != "${ALLOWED_PREVIEW_SOURCE_BRANCH}" ]; then
            echo "Refusing preview sync from ${APP_REF}; only ${ALLOWED_PREVIEW_SOURCE_BRANCH} may update mytemark2/hado_library-preview." >&2
            exit 1
          fi
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          if [ "${SOURCE_COMMIT}" != "${GITHUB_SHA}" ]; then
            echo "Checked-out source commit ${SOURCE_COMMIT} does not match GITHUB_SHA ${GITHUB_SHA}." >&2
            exit 1
          fi
          echo "app_ref=${APP_REF}" >> "${GITHUB_OUTPUT}"
          echo "source_commit=${SOURCE_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "Preview source branch: ${APP_REF}"
          echo "Preview source commit: ${SOURCE_COMMIT}"

      - name: Read source display version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          display_version="$(python - <<'PY'
          import re
          from pathlib import Path
          source = Path('hado_version.js').read_text(encoding='utf-8')
          release = re.search(r"releaseVersion:\s*'([^']+)'", source)
          update = re.search(r"updateNo:\s*'([^']+)'", source)
          if not release or not update:
              raise SystemExit('releaseVersion/updateNo not found in hado_version.js')
          print(f"{release.group(1)} Update{update.group(1)}")
          PY
          )"
          if [ -z "${display_version}" ]; then
            echo "displayVersion could not be resolved from hado_version.js" >&2
            exit 1
          fi
          echo "display_version=${display_version}" >> "${GITHUB_OUTPUT}"
          echo "Source display version: ${display_version}"

      - name: Require preview repository token
        shell: bash
        env:
          PREVIEW_REPO_TOKEN: ${{ secrets.PREVIEW_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_REPO_TOKEN}" ]; then
            echo "Repository secret PREVIEW_REPO_TOKEN is missing." >&2
            echo "Create a fine-grained token with access to mytemark2/hado_library-preview and permission Contents: Read and write, then register it as PREVIEW_REPO_TOKEN in mytemark2/hado_library. The preview repository push triggers deployment; Actions: Read and write is not required." >&2
            exit 1
          fi

      - name: Sync preview repository contents
        id: sync
        shell: bash
        env:
          PREVIEW_REPO_TOKEN: ${{ secrets.PREVIEW_REPO_TOKEN }}
          APP_REF: ${{ steps.source.outputs.app_ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          DISPLAY_VERSION: ${{ steps.meta.outputs.display_version }}
        run: |
          set -euo pipefail
          changed=false
          for attempt in 1 2 3; do
            PREVIEW_DIR="$(mktemp -d)"
            echo "Preview sync attempt ${attempt}/3"
            git clone --depth 1 "https://x-access-token:${PREVIEW_REPO_TOKEN}@github.com/mytemark2/hado_library-preview.git" "${PREVIEW_DIR}"

            preview_pages_workflow="${PREVIEW_DIR}/.github/workflows/jekyll-gh-pages.yml"
            if [ -f "${preview_pages_workflow}" ]; then
              PREVIEW_PAGES_WORKFLOW="${preview_pages_workflow}" python - <<'PREVIEW_PY'
import os
import re
from pathlib import Path
path = Path(os.environ['PREVIEW_PAGES_WORKFLOW'])
text = path.read_text(encoding='utf-8')
if 'cancel-in-progress:' in text:
    text = re.sub(r'(?m)^(\s*cancel-in-progress:\s*).+$', r'\1true', text, count=1)
elif re.search(r'(?m)^concurrency:\s*$', text):
    text = re.sub(r'(?m)^concurrency:\s*$', 'concurrency:\n  cancel-in-progress: true', text, count=1)
else:
    text = re.sub(r'(?m)^jobs:\s*$', 'concurrency:\n  group: hado-library-preview-pages\n  cancel-in-progress: true\n\njobs:', text, count=1)
if 'cancel-in-progress: true' not in text:
    raise SystemExit('failed to enforce preview Pages cancel-in-progress: true')
path.write_text(text, encoding='utf-8')
PREVIEW_PY
            else
              echo "Preview Pages workflow .github/workflows/jekyll-gh-pages.yml was not found; public deployment concurrency could not be patched." >&2
              exit 1
            fi

            find "${PREVIEW_DIR}" -mindepth 1 -maxdepth 1 \
              ! -name '.git' \
              ! -name '.github' \
              -exec rm -rf {} +
            rsync -a index.html HADO_DEV_INFO.json hado_*.js hado_styles.css hadou_*.json "${PREVIEW_DIR}/"

            touch "${PREVIEW_DIR}/.nojekyll"
            printf '%s\n' "${SOURCE_COMMIT}" > "${PREVIEW_DIR}/PREVIEW_SOURCE_COMMIT.txt"
            printf '%s\n' "${APP_REF}" > "${PREVIEW_DIR}/PREVIEW_SOURCE_BRANCH.txt"
            printf '%s\n' "${DISPLAY_VERSION}" > "${PREVIEW_DIR}/PREVIEW_DISPLAY_VERSION.txt"
            sha256sum index.html hado_formation.js hado_styles.css hado_version.js HADO_DEV_INFO.json > "${PREVIEW_DIR}/PREVIEW_SOURCE_FILES.txt"

            test -s "${PREVIEW_DIR}/hado_formation.js"
            test -s "${PREVIEW_DIR}/hado_styles.css"
            test -s "${PREVIEW_DIR}/HADO_DEV_INFO.json"
            cmp -s HADO_DEV_INFO.json "${PREVIEW_DIR}/HADO_DEV_INFO.json"
            test -s "${PREVIEW_DIR}/PREVIEW_SOURCE_COMMIT.txt"
            test -s "${PREVIEW_DIR}/PREVIEW_SOURCE_BRANCH.txt"
            test -s "${PREVIEW_DIR}/PREVIEW_DISPLAY_VERSION.txt"
            test -s "${PREVIEW_DIR}/PREVIEW_SOURCE_FILES.txt"
            test "$(cat "${PREVIEW_DIR}/PREVIEW_SOURCE_BRANCH.txt")" = "${ALLOWED_PREVIEW_SOURCE_BRANCH}"
            test "$(cat "${PREVIEW_DIR}/PREVIEW_SOURCE_COMMIT.txt")" = "${SOURCE_COMMIT}"
            test "$(cat "${PREVIEW_DIR}/PREVIEW_DISPLAY_VERSION.txt")" = "${DISPLAY_VERSION}"
            (cd "${PREVIEW_DIR}" && sha256sum -c PREVIEW_SOURCE_FILES.txt)

            git -C "${PREVIEW_DIR}" config user.name "github-actions[bot]"
            git -C "${PREVIEW_DIR}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "${PREVIEW_DIR}" add -A
            if git -C "${PREVIEW_DIR}" diff --cached --quiet; then
              echo "No preview repository changes."
              rm -rf "${PREVIEW_DIR}"
              echo "changed=false" >> "${GITHUB_OUTPUT}"
              break
            fi

            git -C "${PREVIEW_DIR}" commit -m "sync preview from ${APP_REF}: ${SOURCE_COMMIT}"
            if git -C "${PREVIEW_DIR}" push origin HEAD:main; then
              changed=true
              rm -rf "${PREVIEW_DIR}"
              echo "changed=true" >> "${GITHUB_OUTPUT}"
              break
            fi

            rm -rf "${PREVIEW_DIR}"
            if [ "${attempt}" = "3" ]; then
              echo "Preview repository push failed after ${attempt} attempts; another run may be updating main continuously." >&2
              exit 1
            fi
            echo "Preview repository main changed during push; retrying with a fresh clone." >&2
            sleep $((attempt * 5))
          done
          echo "Preview repository content is synchronized from ${APP_REF} (${SOURCE_COMMIT}); changed=${changed}."

      - name: Verify public preview deployment
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          DISPLAY_VERSION: ${{ steps.meta.outputs.display_version }}
        run: |
          set -euo pipefail
          base_url="https://mytemark2.github.io/hado_library-preview"
          stale_patterns=('2.9.6 操作ガイド' '覇道ライブラリ｜v2.9.2.0' 'Update08')
          for attempt in $(seq 1 30); do
            cache_bust="${SOURCE_COMMIT}-${attempt}-$(date +%s)"
            commit_text="$(curl -fsSL "${base_url}/PREVIEW_SOURCE_COMMIT.txt?cb=${cache_bust}" || true)"
            display_text="$(curl -fsSL "${base_url}/PREVIEW_DISPLAY_VERSION.txt?cb=${cache_bust}" || true)"
            index_html="$(curl -fsSL "${base_url}/?cb=${cache_bust}" || true)"
            version_js="$(curl -fsSL "${base_url}/hado_version.js?cb=${cache_bust}" || true)"
            if [ "${commit_text}" = "${SOURCE_COMMIT}" ] && [ "${display_text}" = "${DISPLAY_VERSION}" ] && printf '%s' "${version_js}" | grep -q "updateNo:"; then
              stale_found=false
              for pattern in "${stale_patterns[@]}"; do
                if printf '%s' "${index_html}" | grep -Fq "${pattern}"; then
                  echo "Public preview still contains stale fixed version text: ${pattern}" >&2
                  stale_found=true
                fi
              done
              if [ "${stale_found}" = false ]; then
                echo "Public preview matches ${SOURCE_COMMIT} / ${DISPLAY_VERSION} and contains no stale fixed version strings."
                exit 0
              fi
            fi
            echo "Waiting for public preview deployment (${attempt}/30): commit='${commit_text}' display='${display_text}' expected='${SOURCE_COMMIT}'/'${DISPLAY_VERSION}'"
            sleep 10
          done
          echo "Public preview did not deploy ${SOURCE_COMMIT} / ${DISPLAY_VERSION}, or stale fixed version text remained." >&2
          exit 1
